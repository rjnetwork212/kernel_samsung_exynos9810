name: Build KernelSU Exynos9810 (Clang NDK r25)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Source
      uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y bc bison flex libfl-dev libssl-dev libelf-dev build-essential curl git unzip

    - name: Download Android NDK r25 (Clang 14.0.6)
      run: |
        curl -o ndk.zip https://dl.google.com/android/repository/android-ndk-r25-linux.zip
        unzip -q ndk.zip
        mv android-ndk-r25 android-ndk

    - name: Add KernelSU Next + susfs
      run: |
        curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -
        curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next-susfs/kernel/setup.sh" | bash -s next-susfs

    - name: Build Kernel with Android Clang
      run: |
        export PATH=$(pwd)/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
        make LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-android- ARCH=arm64 SUBARCH=arm64 exynos9810_defconfig
        make LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-android- ARCH=arm64 SUBARCH=arm64 -j$(nproc) V=2 | tee build.log

    - name: Package into Flashable ZIP
      run: |
        git clone https://github.com/osm0sis/AnyKernel3.git
        cp arch/arm64/boot/Image AnyKernel3/zImage
        cd AnyKernel3
        zip -r9 ../KernelSU_Flashable.zip *

    - name: Upload Flashable ZIP
      uses: actions/upload-artifact@v4
      with:
        name: KernelSU_ZIP
        path: KernelSU_Flashable.zip

    - name: Upload Full Build Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: full-build-log
        path: build.loga
